<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoloClass</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1d2433;--sub:#667085;--pri:#7a2fe0;--line:#d5d9e6;--win:#16a34a;--lose:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2d;--text:#eef0f6;--sub:#9aa3b8;--pri:#a67dff;--line:#2b3246;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2d;--text:#eef0f6;--sub:#9aa3b8;--pri:#a67dff;--line:#2b3246;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;transition:background .3s,color .3s;user-select:none;-webkit-user-select:none}
.wrap{max-width:480px;margin:0 auto;padding:64px 18px 30px}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;display:flex;gap:7px}
.btn,.ctl button,.games button,.grid button,.top button{--c1:#b86cff;--c2:#7a2fe0;--c3:#3b1a82;border:3px solid #0b0b14;border-radius:14px;color:#fff;font-weight:900;cursor:pointer;
text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 3px 0 rgba(0,0,0,.45);
background:linear-gradient(var(--c1),var(--c2));box-shadow:0 6px 0 var(--c3),0 9px 8px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.4);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled),.ctl button:active:not(:disabled),.games button:active,.grid button:active,.top button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c3),0 2px 3px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.4)}
button:disabled{opacity:.5;filter:grayscale(.7)}
.grid button,.top button{--c1:#4db8ff;--c2:#1f78d6;--c3:#123f7a}
button.g{--c1:#7a88a8;--c2:#4a5673;--c3:#262d40}
button.alt{--c1:#4db8ff;--c2:#1f78d6;--c3:#123f7a}
button.gd,.grid button.sel,.grid button.last{--c1:#ffd54a;--c2:#e0a200;--c3:#7a5600}
button.red{--c1:#ff7b7b;--c2:#d62828;--c3:#6b1010}
button.grn{--c1:#5be37d;--c2:#1fa84a;--c3:#0f5a26}
.top button{padding:6px 10px;font-size:15px}
.screen{display:none;animation:in .3s}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;margin:0 0 6px}h2{font-size:21px;margin:0 0 6px}
p.s{color:var(--sub);margin:0 0 16px}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 0 var(--line)}
input[type=number]{width:100%;font-size:28px;text-align:center;padding:14px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:14px;user-select:text}
input:focus{outline:none;border-color:var(--pri)}
.btn{width:100%;padding:14px;font-size:18px;margin:8px 0 6px;display:block}
.err{color:var(--lose);min-height:20px;font-size:14px;margin-bottom:4px;text-align:center}
.av{width:72px;height:72px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;overflow:hidden;flex:none;border:3px solid #0b0b14}
.av img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.grid button{aspect-ratio:1;font-size:18px}
.row{display:flex;gap:10px}.row .btn{margin-top:0}
.vs{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.vs .p{text-align:center;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:6px}
.vs b{font-size:24px;color:var(--pri)}
.games{display:grid;gap:14px}
.games button{display:flex;align-items:center;gap:14px;text-align:left;padding:14px;font-size:19px}
.games .e{font-size:32px}.games small{display:block;color:#fff;opacity:.85;font-size:13px;margin-top:2px;font-weight:700}
.board{margin:20px 0 10px;font-size:14px;color:var(--sub)}
.board .tot{display:flex;justify-content:space-around;text-align:center;margin-bottom:10px}
.board .tot b{display:block;font-size:22px;color:var(--text)}
.board .ln{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}
.lr{display:grid;grid-template-columns:34px 1fr 1.2fr 48px 48px;gap:4px;padding:9px 6px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.lr.h{font-weight:800;color:var(--sub);border:0;font-size:12px}.lr.me{background:#ffd54a33;border-radius:10px}
.stage{position:relative;background:var(--bg);border:3px solid #0b0b14;border-radius:16px;overflow:hidden;margin-bottom:14px}
.lane{position:relative;height:74px;border-bottom:2px dashed var(--line)}
.lane:last-child{border:0}
.lane .av{position:absolute;left:6px;top:11px;transition:left .1s linear}
.lane::after{content:"🏁";position:absolute;right:6px;top:20px;font-size:28px}
.duel{display:flex;justify-content:space-between;align-items:flex-end;height:170px;padding:16px 14px}
.fi{width:38%;display:flex;flex-direction:column;align-items:center;gap:8px}
.fi .av{width:84px;height:84px;transition:transform .3s,filter .5s,opacity .5s}
.hp{width:100%;height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:var(--win);transition:width .2s,background .2s}
.av.down{transform:rotate(80deg) translateY(20px);filter:grayscale(1);opacity:.45}
.av.hit{animation:shake .25s 2}
.av.guard{box-shadow:0 0 0 4px #38bdf8}
@keyframes shake{50%{transform:translateX(-9px)}}
.light{display:flex;justify-content:center;gap:10px;padding:12px;background:#222}
.light i{width:34px;height:34px;border-radius:50%;background:#444;display:block}
.light i.r.on{background:#ef4444;box-shadow:0 0 18px #ef4444}.light i.g.on{background:#22c55e;box-shadow:0 0 18px #22c55e}
.say{text-align:center;font-size:18px;font-weight:700;min-height:28px;margin-bottom:8px}
.ctl{display:flex;flex-wrap:wrap;gap:12px 10px;margin-bottom:14px;touch-action:none}
.ctl button{flex:1 1 22%;padding:16px 6px;font-size:19px}
.ctl .br{flex-basis:100%;height:0}
.res{text-align:center;font-size:30px;font-weight:800;margin:6px 0 10px}
.res.w{color:var(--win)}.res.l{color:var(--lose)}
/* splash */
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#4b1fa8,#120a2e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .5s;color:#fff}
#splash.out{opacity:0;pointer-events:none}
.logo{width:130px;height:130px;border-radius:32px;border:5px solid #0b0b14;background:linear-gradient(#c58bff,#7a2fe0);box-shadow:0 12px 0 #3b1a82,0 0 50px #a67dffaa,inset 0 6px 0 #ffffff66;display:flex;align-items:center;justify-content:center;font-size:70px;animation:drop 1.1s cubic-bezier(.3,1.4,.5,1) both,glow 1.6s 1.1s infinite alternate}
@keyframes drop{0%{transform:translateY(-420px) rotate(-240deg) scale(.3)}70%{transform:translateY(0) rotate(14deg) scale(1.15)}100%{transform:none}}
@keyframes glow{to{transform:scale(1.07) rotate(-3deg)}}
.nm{font-size:44px;font-weight:900;letter-spacing:1px;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 6px 0 #3b1a82}
.nm i{display:inline-block;font-style:normal;opacity:0;animation:pop .5s calc(.8s + var(--i)*.09s) forwards}
@keyframes pop{0%{opacity:0;transform:translateY(34px) scale(.4)}70%{transform:translateY(-8px) scale(1.2)}100%{opacity:1;transform:none}}
#splash small{opacity:.6;position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
</style>
</head>
<body>
<div id="splash"><div class="logo">⚔️</div><div class="nm" id="nm"></div><small>tap to skip</small></div>
<div class="top"><button id="lbb">🏆</button><button id="lang">EN</button><button id="snd">🔊</button><button id="theme">🌙</button></div>
<div class="wrap">

<section class="screen on" id="s1"><div class="card">
<h1 data-i="t1"></h1><p class="s" data-i="s1"></p>
<input type="number" id="seat" min="1" inputmode="numeric" data-ph="ph1">
<div class="err" id="e1"></div><button class="btn" id="b1" data-i="next"></button></div></section>

<section class="screen" id="s2"><div class="card">
<h2 data-i="t2"></h2><p class="s" data-i="s2"></p>
<input type="number" id="total" min="2" max="60" inputmode="numeric" data-ph="ph2">
<div class="err" id="e2"></div><button class="btn" id="b2" data-i="next"></button></div></section>

<section class="screen" id="s3"><div class="card pick">
<h2 data-i="t3"></h2><p class="s" style="margin:0" data-i="s3"></p>
<div class="av" id="myav" style="width:120px;height:120px;font-size:46px"></div>
<input type="file" id="file" accept="image/*" hidden>
<button class="btn alt" id="up" data-i="up"></button>
<button class="btn g" id="rmp" data-i="rmp"></button>
<button class="btn gd" id="b3" data-i="go3"></button></div></section>

<section class="screen" id="s4"><div class="card">
<h2 data-i="t4"></h2><p class="s" id="me4"></p>
<div class="grid" id="grid"></div>
<button class="btn grn" id="rnd" data-i="rnd"></button>
<div class="row" style="margin-top:8px"><button class="btn g" id="set1" data-i="set1"></button><button class="btn g" id="set3" data-i="set3"></button></div></div></section>

<section class="screen" id="s5">
<div class="vs" id="vs5"></div>
<div class="games">
<button data-g="race" class="gd"><span class="e">🏎️</span><span><span data-i="g_race"></span><small data-i="g_race_s"></small></span></button>
<button data-g="knife" class="red"><span class="e">🔪</span><span><span data-i="g_knife"></span><small data-i="g_knife_s"></small></span></button>
<button data-g="light" class="grn"><span class="e">🚦</span><span><span data-i="g_light"></span><small data-i="g_light_s"></small></span></button>
<button data-g="mm2"><span class="e">🕵️</span><span><span data-i="g_mm2"></span><small data-i="g_mm2_s"></small></span></button>
</div>
<div class="board" id="board"></div>
<button class="btn g" id="back4" data-i="back4"></button></section>

<section class="screen" id="s6">
<div class="vs" id="vs6"></div>
<div class="say" id="say"></div>
<div class="stage" id="stage"></div>
<div class="ctl" id="ctl"></div>
<div class="res" id="res"></div>
<div id="after" style="display:none">
<button class="btn gd" id="again" data-i="again"></button>
<button class="btn g" id="chg" data-i="chg"></button>
<button class="btn g" id="chop" data-i="chop"></button></div>
<button class="btn g" id="quit" data-i="quit"></button></section>

<section class="screen" id="s7"><div class="card">
<h2 data-i="t7"></h2><p class="s" data-i="s7"></p>
<div class="grid" id="grid7"></div>
<div class="say" id="c7"></div>
<button class="btn gd" id="go7" data-i="go7"></button>
<div class="row" style="margin-top:8px"><button class="btn grn" id="r7" data-i="r7"></button><button class="btn g" id="x7" data-i="x7"></button></div></div></section>

<section class="screen" id="s8"><div class="card">
<h2 data-i="t8"></h2><p class="s" data-i="s8"></p>
<div id="lb"></div>
<button class="btn g" id="x8" data-i="x8"></button></div></section>

</div>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>a+Math.random()*(b-a);
const K='classBattle1';
const nst=()=>({w:0,l:0,s:0,b:0,g:{race:[0,0],knife:[0,0],light:[0,0],mm2:[0,0]}});
const mk=()=>({seat:0,total:0,photo:null,opp:0,theme:null,sound:true,lang:null,squad:[],lb:{}});
let S=mk();
try{const o=JSON.parse(localStorage.getItem(K)||'null');if(o){S=Object.assign(mk(),o);S.lb=o.lb||{};if(o.st&&o.seat&&!S.lb[o.seat])S.lb[o.seat]=o.st;delete S.st}}catch(e){}
if(!S.lang)S.lang=/^zh/i.test(navigator.language||'zh')?'zh':'en';
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const li=()=>S.lang==='en'?1:0,tr=(z,e)=>li()?e:z;
const st0=()=>{const t=S.lb[S.seat]||(S.lb[S.seat]=nst());t.g=Object.assign(nst().g,t.g);return t};
const I={
t1:['👋 歡迎來到對戰場','👋 Welcome to the Arena'],s1:['請輸入你的座號','Enter your seat number'],ph1:['座號','Seat #'],next:['下一步','Next'],
t2:['班上有幾個人？','How many students?'],s2:['輸入全班總人數','Enter the class size'],ph2:['人數','Count'],
t3:['你的頭像','Your avatar'],s3:['上傳照片，沒有的話就用號碼','Upload a photo, or use your number'],up:['📷 上傳照片','📷 Upload photo'],rmp:['移除照片','Remove photo'],go3:['儲存並開始 ⚔️','Save & start ⚔️'],
t4:['選擇對手號碼','Choose your opponent'],rnd:['🎲 隨機對手','🎲 Random opponent'],set1:['⚙️ 重新設定','⚙️ Setup'],set3:['🖼️ 換頭像','🖼️ Avatar'],
g_race:['賽車賽跑','Street Racing'],g_race_s:['轉彎、漂移、氮氣、道具','Turns, drift, nitro, items'],
g_knife:['拿刀 PK','Knife Duel'],g_knife_s:['按砍擊、防禦打倒對方','Attack & guard to win'],
g_light:['紅綠燈','Red Light Green Light'],g_light_s:['綠燈按住前進，紅燈要放手','Hold on green, release on red'],
g_mm2:['殺手模式','Murder Mode'],g_mm2_s:['警長、殺手、平民，5 人對戰','Sheriff · Murderer · Innocent, 5 players'],
back4:['← 換對手','← Opponent'],again:['再玩一次','Play again'],chg:['換遊戲','Games'],chop:['換對手','Opponent'],quit:['離開遊戲','Quit'],
t7:['🕵️ 殺手模式','🕵️ Murder Mode'],s7:['你自動參加，再選 4 位同學，共 5 人。身分隨機分配，機率相同，其他人都是機器人。','You join automatically. Pick 4 classmates (5 players). Roles are random and equally likely; the others are bots.'],
go7:['開始遊戲','Start'],r7:['🎲 隨機選','🎲 Random'],x7:['← 返回','← Back'],
t8:['🏆 排行榜','🏆 Leaderboard'],s8:['依勝場排名，紀錄不能清除','Ranked by wins. Records cannot be cleared.'],x8:['← 返回','← Back']};
let cur='s1';
function applyLang(){document.documentElement.lang=li()?'en':'zh-Hant';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=I[e.dataset.i][li()]);
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=I[e.dataset.ph][li()]);$('lang').textContent=li()?'中':'EN'}
$('lang').onclick=()=>{S.lang=li()?'zh':'en';save();applyLang();if(cur==='s4')toS4();else if(cur==='s5')toS5();else if(cur==='s8')toS8()};
applyLang();

function show(id){cur=id;document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}
const av=(n,p)=>`<div class="av">${p?`<img src="${p}" alt="">`:n}</div>`;
const vsHTML=()=>`<div class="p">${av(S.seat,S.photo)}${tr(`你（${S.seat}號）`,`You (#${S.seat})`)}</div><b>VS</b><div class="p">${av(S.opp)}${tr(S.opp+'號','#'+S.opp)}</div>`;

let ac;function beep(f=440,d=.12,t='sine'){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const jingle=w=>(w?[523,659,784,1047]:[392,330,262,196]).forEach((f,i)=>setTimeout(()=>beep(f,.2,w?'triangle':'sawtooth'),i*140));
function setSnd(){$('snd').textContent=S.sound?'🔊':'🔇'}
$('snd').onclick=()=>{S.sound=!S.sound;setSnd();save();beep()};setSnd();
function setTheme(t){document.documentElement.dataset.theme=t;$('theme').textContent=t==='dark'?'☀️':'🌙'}
setTheme(S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('theme').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(S.theme);save()};

/* splash */
$('nm').innerHTML='SoloClass'.split('').map((ch,i)=>`<i style="--i:${i}">${ch}</i>`).join('');
const sp=$('splash');let spDone=false;const endSp=()=>{if(spDone)return;spDone=true;sp.classList.add('out');setTimeout(()=>sp.style.display='none',550)};
sp.onclick=endSp;setTimeout(endSp,2800);[0,.9,1.3,1.7].forEach((t,i)=>setTimeout(()=>{if(!spDone)beep([392,523,659,784][i],.18,'triangle')},t*1000));

$('seat').value=S.seat||'';$('total').value=S.total||'';
$('b1').onclick=()=>{const v=+$('seat').value;if(!Number.isInteger(v)||v<1){$('e1').textContent=tr('請輸入正確的座號','Enter a valid seat number');return}S.seat=v;$('e1').textContent='';show('s2')};
$('b2').onclick=()=>{const v=+$('total').value;if(!Number.isInteger(v)||v<2||v>60){$('e2').textContent=tr('請輸入 2～60 的人數','Enter a number from 2 to 60');return}
 if(v<S.seat){$('e2').textContent=tr(`人數不能比你的座號（${S.seat}）少`,`Must be at least your seat number (${S.seat})`);return}S.total=v;$('e2').textContent='';save();toS3()};
function myav(){$('myav').innerHTML=S.photo?`<img src="${S.photo}">`:(S.seat||'?')}
function toS3(){myav();show('s3')}
$('up').onclick=()=>$('file').click();
$('rmp').onclick=()=>{S.photo=null;myav();save()};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{
 const c=document.createElement('canvas'),z=200;c.width=c.height=z;const m=Math.min(img.width,img.height);
 c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);S.photo=c.toDataURL('image/jpeg',.8);save();myav();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)};
$('b3').onclick=()=>{save();toS4()};
function toS4(){$('me4').textContent=tr(`你是 ${S.seat} 號，點一位同學挑戰（金色＝上次對手）`,`You are #${S.seat}. Tap a classmate (gold = last opponent)`);const g=$('grid');g.innerHTML='';
 for(let i=1;i<=S.total;i++){if(i===S.seat)continue;const b=document.createElement('button');b.textContent=i;if(i===S.opp)b.className='last';b.onclick=()=>pickOpp(i);g.appendChild(b)}show('s4')}
function pickOpp(i){S.opp=i;save();toS5()}
$('rnd').onclick=()=>{let i;do{i=1+Math.floor(Math.random()*S.total)}while(i===S.seat);pickOpp(i)};
$('set1').onclick=()=>show('s1');$('set3').onclick=toS3;
function toS5(){$('vs5').innerHTML=vsHTML();board();show('s5')}
$('back4').onclick=toS4;$('chg').onclick=toS5;$('chop').onclick=toS4;$('again').onclick=()=>play(game);
$('quit').onclick=()=>{stop();toS5()};
const NAME={race:['🏎️ 賽車','🏎️ Racing'],knife:['🔪 拿刀','🔪 Knife'],light:['🚦 紅綠燈','🚦 Red Light'],mm2:['🕵️ 殺手模式','🕵️ Murder Mode']};
function ranks(){return Object.entries(S.lb).map(([k,t])=>({k:+k,w:t.w,l:t.l,b:t.b,r:t.w+t.l?t.w/(t.w+t.l):0})).sort((a,b)=>b.w-a.w||b.r-a.r||a.l-b.l)}
function board(){const t=st0(),rk=ranks().findIndex(r=>r.k===S.seat)+1,tot=t.w+t.l;

 const upd=()=>[0,1].forEach(i=>{const h=$('h'+i);h.style.width=Math.max(0,hp[i])+'%';h.style.background=hp[i]>50?'var(--win)':hp[i]>25?'#f59e0b':'var(--lose)'});
 const hurt=(i,d)=>{hp[i]-=d;upd();const el=i?b:a;el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');beep(i?180:120,.15,'sawtooth');

 setCtl(`<button id="hold" class="grn">${tr('👆 按住前進','👆 Hold to run')}</button>`);
 const dn=e=>{if(e)e.preventDefault();hold=true},up=()=>hold=false;
 $('hold').addEventListener('pointerdown',dn);addEventListener('pointerup',up);addEventListener('pointercancel',up);
 const kd=e=>{if(e.code==='Space'&&!e.repeat)dn(e)},ku=e=>{if(e.code==='Space')up()};addEventListener('keydown',kd);addEventListener('keyup',ku);
 const lamp=g=>{green=g;G.classList.toggle('on',g);R.classList.toggle('on',!g);if(!g)redAt=performance.now();$('say').textContent=g?tr('🟢 綠燈！按住衝！','🟢 Green! Hold to run!'):tr('🔴 紅燈！放手！','🔴 Red! Let go!');beep(g?800:250,.2)};
 const end=w=>{if(over)return;over=true;finish(w)};
 const phase=()=>{if(over||id!==run)return;if(!green){lamp(true);tm=setTimeout(phase,rnd(1200,2400))}else{lamp(false);
   if(Math.random()<.18){op=Math.min(op+4,100);b.style.left=6+op/100*W()+'px';b.style.filter='grayscale(1)';$('say').textContent=tr(`🚨 ${S.opp}號被抓到動了！`,`🚨 #${S.opp} moved on red!`);beep(150,.4,'sawtooth');end(true);return}
   tm=setTimeout(phase,rnd(1000,2000))}};
 const tick=t=>{if(over||id!==run)return;const dt=Math.min(50,t-(last||t));last=t;
  if(green){if(hold)me=Math.min(100,me+dt/45);op=Math.min(100,op+dt/45*pace)}
  else if(hold&&t-redAt>220){a.style.filter='grayscale(1)';$('say').textContent=tr('🚨 紅燈你動了！','🚨 You moved on red!');beep(150,.4,'sawtooth');end(false);return}
  a.style.left=6+me/100*W()+'px';b.style.left=6+op/100*W()+'px';
  if(me>=100)return end(true);if(op>=100)return end(false);raf=requestAnimationFrame(tick)};
 cleanup=()=>{clearTimeout(tm);cancelAnimationFrame(raf);over=true;removeEventListener('pointerup',up);removeEventListener('pointercancel',up);removeEventListener('keydown',kd);removeEventListener('keyup',ku)};
 $('say').textContent=tr('🔴 預備…','🔴 Ready…');await sleep(1200);if(id!==run)return;
 lamp(true);tm=setTimeout(phase,rnd(1200,2400));raf=requestAnimationFrame(tick);
}

/* 🕵️ 殺手模式：3 張地圖、大量障礙物 */
const MAPS=[
 {n:['🏫 教室','🏫 Classroom'],fl:'#3a3550',wc:'#8d6e63',r:()=>{const a=[];for(let i=0;i<3;i++)for(let j=0;j<4;j++)a.push([50+j*100,110+i*105,60,26]);a.push([190,30,100,24],[20,20,26,26],[434,20,26,26],[20,434,26,26],[434,434,26,26]);return a}},
 {n:['🏙️ 街區','🏙️ City'],fl:'#454c5c',wc:'#6d7a99',r:()=>[[40,40,130,110],[230,50,80,90],[360,40,80,130],[40,220,90,100],[180,200,110,90],[340,230,100,70],[60,380,120,70],[240,350,60,100],[350,370,90,80]]},
 {n:['🌳 公園','🌳 Park'],fl:'#2f6a45',wc:'#1f8a4c',r:()=>[[190,190,100,100,'#2b6cb0'],[60,60,32,32],[400,60,32,32],[60,390,32,32],[400,390,32,32],[120,120,10,100],[350,260,10,110],[220,70,60,12],[220,400,60,12],[90,280,60,14],[330,110,70,14],[140,350,30,30],[300,330,30,30]]}
];
async function mm2(id){
 const WW=480,VW=320,EM={M:'🔪',S:'🔫',I:'🙂'},RN={M:['殺手','Murderer'],S:['警長','Sheriff'],I:['平民','Innocent']},
 HT={M:['殺光所有人！','Eliminate everyone!'],S:['點人瞄準再開槍，射錯平民你也會死！','Tap to aim, then shoot. Hit an innocent and you die too!'],I:['躲好、別被殺手碰到！','Hide! Avoid the murderer!']};
 const MP=MAPS[Math.floor(Math.random()*MAPS.length)],R=MP.r();
 const hit=(x,y)=>x<14||y<14||x>WW-14||y>WW-14||R.some(([rx,ry,w,h])=>{const nx=Math.max(rx,Math.min(x,rx+w)),ny=Math.max(ry,Math.min(y,ry+h));return Math.hypot(x-nx,y-ny)<13});
 const mvE=(p,dx,dy)=>{const ox=p.x,oy=p.y;if(!hit(p.x+dx,p.y))p.x+=dx;if(!hit(p.x,p.y+dy))p.y+=dy;return Math.hypot(p.x-ox,p.y-oy)};
 const los=(a,b)=>{for(let i=1;i<16;i++){const x=a.x+(b.x-a.x)*i/16,y=a.y+(b.y-a.y)*i/16;if(R.some(([rx,ry,w,h])=>x>rx&&x<rx+w&&y>ry&&y<ry+h))return false}return true};
 const free=()=>{let x,y,k=0;do{x=rnd(30,WW-30);y=rnd(30,WW-30);k++}while(hit(x,y)&&k<200);return{x,y}};
 const roles=['M','S','I','I','I'].sort(()=>Math.random()-.5);
 const pl=[S.seat,...S.squad.slice(0,4)].map((n,i)=>({n,me:i===0,r:roles[i],...free(),a:1,tx:rnd(30,450),ty:rnd(30,450),w:0,cd:0,t:0,stk:0,wp:null,wt:0})),me=pl[0];
 $('stage').innerHTML=`<canvas id="cv" width="${VW}" height="${VW}" style="width:100%;display:block;touch-action:none"></canvas>`;
 const cv=$('cv'),c=cv.getContext('2d'),im=new Image();if(S.photo)im.src=S.photo;
 const MV={l:0,r:0,u:0,d:0};let aim=null,actCd=0,spr=0,sprCd=0,left=75,last=0,raf,go=false,over=false,sec=-1;
 setCtl(`<button id="ml">◀</button><button id="mu">▲</button><button id="md">▼</button><button id="mr">▶</button><i class="br"></i><button id="ma" class="red">${me.r==='M'?tr('🔪 殺！','🔪 Stab!'):me.r==='S'?tr('🔫 開槍','🔫 Shoot'):tr('🙂 躲好','🙂 Hide')}</button><button id="ms" class="alt">${tr('💨 衝刺','💨 Dash')}</button>`);
 if(me.r==='I')$('ma').disabled=true;
 [['ml','l'],['mr','r'],['mu','u'],['md','d']].forEach(([b,k])=>$(b).addEventListener('pointerdown',e=>{e.preventDefault();MV[k]=1}));
 const rel=()=>{MV.l=MV.r=MV.u=MV.d=0};addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
 const near=(p,r,f)=>{let b=null,bd=r;pl.forEach(q=>{if(q!==p&&q.a&&(!f||f(q))){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;b=q}}});return b};
 const kill=p=>{p.a=0;beep(160,.25,'sawtooth')};
 const shoot=(s,t)=>{if(!los(s,t)){if(s.me)$('say').textContent=tr('被障礙物擋住了！','Blocked by an obstacle!');return false}beep(900,.1,'square');if(t.r==='M')kill(t);else{kill(t);kill(s)}return true};
 const act=()=>{if(!go||!me.a||actCd>0)return;
  if(me.r==='M'){const t=near(me,38);if(t){kill(t);actCd=.6}else $('say').textContent=tr('附近沒有人！','Nobody nearby!')}
  else if(me.r==='S'){const t=(aim&&aim.a)?aim:near(me,999,q=>los(me,q));if(t&&shoot(me,t)){actCd=2;aim=null}}};
 const dash=()=>{if(go&&me.a&&sprCd<=0){spr=1;sprCd=3.5;beep(600,.1)}};
 $('ma').onpointerdown=e=>{e.preventDefault();act()};$('ms').onpointerdown=e=>{e.preventDefault();dash()};
 const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
 const kd=e=>{const m=KM[e.code];if(m){e.preventDefault();MV[m]=1}if(e.code==='Space'){e.preventDefault();act()}if(e.code==='ShiftLeft')dash()},ku=e=>{const m=KM[e.code];if(m)MV[m]=0};
 addEventListener('keydown',kd);addEventListener('keyup',ku);
 const cam=()=>({x:Math.max(0,Math.min(WW-VW,me.x-VW/2)),y:Math.max(0,Math.min(WW-VW,me.y-VW/2))});
 cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),k=cam();aim=near({x:(e.clientX-r.left)*VW/r.width+k.x,y:(e.clientY-r.top)*VW/r.height+k.y},34)});
 const draw=rv=>{const k=cam();c.save();c.translate(-k.x,-k.y);c.fillStyle=MP.fl;c.fillRect(0,0,WW,WW);c.strokeStyle='#ffffff12';c.lineWidth=1;for(let i=0;i<=WW;i+=40){c.beginPath();c.moveTo(i,0);c.lineTo(i,WW);c.moveTo(0,i);c.lineTo(WW,i);c.stroke()}
  R.forEach(([x,y,w,h,col])=>{c.fillStyle=col||MP.wc;c.fillRect(x,y,w,h);c.fillStyle='#ffffff30';c.fillRect(x,y,w,3);c.fillStyle='#00000040';c.fillRect(x,y+h-4,w,4);c.strokeStyle='#0b0b14';c.lineWidth=2;c.strokeRect(x,y,w,h)});
  c.strokeStyle='#0b0b14';c.lineWidth=6;c.strokeRect(0,0,WW,WW);c.textAlign='center';c.textBaseline='middle';
  pl.forEach(p=>{c.beginPath();c.arc(p.x,p.y,14,0,7);c.fillStyle=!p.a?'#444':p.me?'#7a2fe0':'#64748b';c.fill();
   if(p.me&&S.photo&&im.complete&&im.naturalWidth){c.save();c.beginPath();c.arc(p.x,p.y,14,0,7);c.clip();c.drawImage(im,p.x-14,p.y-14,28,28);c.restore()}
   else{c.fillStyle='#fff';c.font='bold 13px sans-serif';c.fillText(p.n,p.x,p.y)}
   c.lineWidth=2.5;c.strokeStyle=p.me?'#fff':'#000';c.beginPath();c.arc(p.x,p.y,14,0,7);c.stroke();
   if(aim===p&&p.a){c.strokeStyle='#ffd54a';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,20,0,7);c.stroke()}
   c.font='16px serif';if(rv||(p.me&&p.a))c.fillText(EM[p.r],p.x,p.y-24);else if(!p.a)c.fillText('❌',p.x,p.y-24)});c.restore()};
 const fin=good=>{if(over)return;over=true;draw(true);const m=pl.find(p=>p.r==='M'),s=pl.find(p=>p.r==='S');finish(me.r==='M'?!good:good);
  $('say').textContent=tr(`${good?'好人獲勝':'殺手獲勝'}！殺手 ${m.n} 號・警長 ${s.n} 號`,`${good?'Good guys win':'Murderer wins'}! Murderer #${m.n} · Sheriff #${s.n}`)};
 const tick=t=>{if(over||id!==run)return;const rdt=Math.min(.05,(t-(last||t))/1000);last=t;
  if(go){const dt=rdt*(me.a?1:3);left-=dt;actCd-=dt;sprCd-=dt;spr-=dt;
   if(me.a){const dx=MV.r-MV.l,dy=MV.d-MV.u,n=Math.hypot(dx,dy)||1,v=75*(spr>0?1.7:1)*dt;mvE(me,dx/n*v,dy/n*v)}
   pl.forEach(p=>{if(p.me||!p.a)return;let tx=p.tx,ty=p.ty;p.t-=dt;p.wt-=dt;
    if(p.r==='M'){const g=near(p,999);if(g){tx=g.x;ty=g.y;if(Math.hypot(g.x-p.x,g.y-p.y)<24){p.w+=dt;if(p.w>.9){kill(g);p.w=0}}else p.w=0}}
    else{if(p.t<=0){p.t=rnd(1,2.5);const f=free();p.tx=f.x;p.ty=f.y}
     if(p.r==='S'){p.cd-=dt;const m=pl.find(q=>q.r==='M'&&q.a);if(m&&p.cd<=0&&Math.hypot(m.x-p.x,m.y-p.y)<140){p.cd=1;if(Math.random()<.2)shoot(p,m)}}}
    if(p.wt>0&&p.wp){tx=p.wp.x;ty=p.wp.y}
    if(!p.a)return;const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,v=(p.r==='M'?52:46)*dt;
    if(d>4){const mvd=mvE(p,dx/d*v,dy/d*v);if(mvd<v*.3){p.stk+=dt;if(p.stk>.4){p.stk=0;p.wp=free();p.wt=1.3}}else p.stk=0}});
   const sc=Math.ceil(left);if(sc!==sec){sec=sc;$('say').textContent=me.a?tr(`${EM[me.r]} 你是${RN[me.r][0]}｜剩 ${Math.max(0,sc)} 秒`,`${EM[me.r]} You: ${RN[me.r][1]} | ${Math.max(0,sc)}s left`):tr('💀 你被淘汰了，快轉觀戰中…','💀 You are out. Fast-forwarding…')}
   const mA=pl.some(p=>p.r==='M'&&p.a),oA=pl.some(p=>p.r!=='M'&&p.a);
   if(!mA)return fin(true);if(!oA)return fin(false);if(left<=0)return fin(true)}
  draw(false);raf=requestAnimationFrame(tick)};
 cleanup=()=>{over=true;cancelAnimationFrame(raf);removeEventListener('pointerup',rel);removeEventListener('pointercancel',rel);removeEventListener('keydown',kd);removeEventListener('keyup',ku)};
 raf=requestAnimationFrame(tick);
 $('say').textContent=tr(`🗺️ ${MP.n[0]}｜🎭 你是${RN[me.r][0]}！${HT[me.r][0]}`,`🗺️ ${MP.n[1]} | 🎭 You are the ${RN[me.r][1]}! ${HT[me.r][1]}`);await sleep(2800);if(id!==run)return;
 if(!await countdown(id))return;go=true;
}

if(S.seat&&S.total){S.opp&&S.opp<=S.total&&S.opp!==S.seat?toS5():toS4()}
</script>
